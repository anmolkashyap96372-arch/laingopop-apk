name: Build LaingoPop APK
on:
  workflow_dispatch:
  push:
    paths: ['LaingoPop_capacitor.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unzip project
        run: |
          mkdir app && unzip -q LaingoPop_capacitor.zip -d app
      - name: Install and add Android
        working-directory: app
        run: |
          npm install
          npx cap add android
      - name: Sound, icons, permissions
        working-directory: app
        run: |
          mkdir -p android/app/src/main/res/raw
          cp android-res-raw/alarm.wav android/app/src/main/res/raw/alarm.wav
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/android/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icons/android/mipmap-$d/ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done 2>/dev/null || true
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LaingoPop-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
